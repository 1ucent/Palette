name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build unsigned IPA
        run: ./build_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nautilus.ipa
          path: build/Nautilus.ipa
          if-no-files-found: error
